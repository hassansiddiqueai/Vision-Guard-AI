services:
  # Backend API Web Service
  - type: web
    name: visionguard-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site
  - type: web
    name: visionguard-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: visionguard-backend
          property: host
